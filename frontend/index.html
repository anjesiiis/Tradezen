<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- VIEWPORT — por que é tão travado assim
         `viewport-fit=cover`: ocupa a área sob o notch/ilha dinâmica.
         `maximum-scale=1` + `user-scalable=no`: impedem o zoom do
         NAVEGADOR. É uma decisão consciente: o gráfico tem zoom próprio
         (pinça da Lightweight Charts), e quando os dois convivem a pinça
         amplia a página inteira em vez dos candles — o gesto mais
         natural do app virava o bug mais irritante dele.
         Ressalva honesta: o Safari do iPhone IGNORA os dois desde o iOS
         10, de propósito, pra não tirar o zoom de quem enxerga mal. Quem
         realmente bloqueia lá é o `touch-action` do CSS (ver appCss) e os
         16px dos campos. Estes dois aqui valem pro Android. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Salvo na tela inicial do iPhone, abre sem a barra do Safari. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Sem isto o iOS transforma preço e volume ("52.79", "79.98M") em
         link de telefone: fica azul, sublinhado, e tocar nele abre o
         discador em cima do gráfico. -->
    <meta name="format-detection" content="telephone=no" />
    <title>TradeZen</title>
    <!-- VIGIA DA TELA BRANCA — mora em /vigia.js, e não inline aqui,
         porque a CSP do site é `script-src 'self'` e script inline não
         executa (ver frontend/vercel.json).

         Fica no <head> e NÃO no <body>: o Vite injeta a tag do bundle no
         fim do <head>, então uma tag no body apareceria DEPOIS dela no
         HTML construído. Na prática o vigia ainda rodaria primeiro (o
         bundle é `type="module"`, logo deferido, e este é script clássico,
         que executa durante o parse) — mas depender dessa sutileza pra
         última rede de segurança do app é frágil. Aqui a ordem é
         explícita no documento.

         Sem `defer`/`async` de propósito: ele precisa executar antes. -->
    <script src="/vigia.js"></script>
  </head>
  <body>
    <div id="root"></div>


    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
