name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping na API
        run: |
          curl --fail --silent --show-error --max-time 90 \
               --retry 3 --retry-delay 10 --retry-all-errors \
               -o /dev/null -w "HTTP %{http_code} em %{time_total}s\n" \
               https://tradezen-7brh.onrender.com/
